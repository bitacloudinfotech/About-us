name: Production Multi-Job Deployment Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: 📦 1. Build Production Bundle
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚡ Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: bita_react/package-lock.json

      - name: 🛠️ Install Dependencies & Build Vite Bundle
        run: |
          cd bita_react
          npm install
          npm run build
          echo "✅ Production bundle built successfully!"

  deploy:
    name: 🚀 2. Deploy Bundle to Server
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 📂 Pull Latest & Sync to /var/www/bita_react
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '74.225.234.158' }}
          username: ${{ secrets.SERVER_USER || 'Tushar' }}
          password: ${{ secrets.SERVER_PASSWORD || 'India@12345!' }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            APP_DIR="$HOME/Streamlit_AI_UX"
            if [ ! -d "$APP_DIR" ]; then
              git clone https://github.com/tusharz10/Streamlit_AI_UX.git "$APP_DIR"
            fi
            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR" || true
            git fetch --all
            git reset --hard origin/main
            git pull origin main
            
            cd "$APP_DIR/bita_react"
            npm install
            npm run build

            sudo mkdir -p /var/www/bita_react
            if command -v rsync &> /dev/null; then
              sudo rsync -av --delete "$APP_DIR/bita_react/dist/" /var/www/bita_react/
            else
              sudo cp -r "$APP_DIR/bita_react/dist/." /var/www/bita_react/
            fi
            sudo chown -R www-data:www-data /var/www/bita_react
            sudo chmod -R 755 /var/www/bita_react
            echo "✅ Static assets deployed to /var/www/bita_react with atomic sync."

  nginx_reload:
    name: ⚙️ 3. Nginx & SSL Zero-Downtime Reload
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🔄 Gracefully Reload Nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST || '74.225.234.158' }}
          username: ${{ secrets.SERVER_USER || 'Tushar' }}
          password: ${{ secrets.SERVER_PASSWORD || 'India@12345!' }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e
            APP_DIR="$HOME/Streamlit_AI_UX"
            cd "$APP_DIR"
            chmod +x deploy.sh
            
            sudo ln -sf /etc/nginx/sites-available/bitacloudinfotech /etc/nginx/sites-enabled/bitacloudinfotech
            sudo rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/bita_react
            
            sudo systemctl enable nginx
            sudo systemctl enable certbot.timer
            sudo nginx -t

            if sudo systemctl is-active --quiet nginx; then
              echo "🔄 Gracefully reloading Nginx..."
              sudo systemctl reload nginx
            else
              echo "🚀 Starting Nginx service..."
              sudo systemctl restart nginx
            fi
            echo "✅ Nginx is running healthy with zero downtime."

  verify_live:
    name: 🌐 4. Live Health & SSL Verification
    needs: nginx_reload
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Verify Live Website & HTTP/HTTPS Status
        run: |
          echo "=========================================================="
          echo "🔍 Verifying live production website: https://bitacloudinfotech.com"
          echo "=========================================================="
          sleep 2
          HTTPS_STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://bitacloudinfotech.com || echo "000")
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://bitacloudinfotech.com || echo "000")
          
          echo "🌐 HTTP Redirect Status: $HTTP_STATUS (expected 301)"
          echo "🔒 HTTPS Status: $HTTPS_STATUS (expected 200)"
          
          if [ "$HTTPS_STATUS" -eq 200 ] || [ "$HTTP_STATUS" -eq 301 ]; then
            echo "=========================================================="
            echo "🎉 WEBSITE IS LIVE, HEALTHY, AND FULLY OPERATIONAL!"
            echo "🌐 URL: https://bitacloudinfotech.com"
            echo "🔒 SSL Status: Active & Secured"
            echo "⚡ Zero-Downtime Deployment: Complete"
            echo "=========================================================="
          else
            echo "❌ Live health check failed. Status: $HTTPS_STATUS"
            exit 1
          fi

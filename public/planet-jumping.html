<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Planet Jumping — Ubernatural Space Portal</title>
  <meta name="description" content="An immersive cinematic space portal experience. Jump between Mars, Earth, and Venus in a stunning 3D canvas-driven portal."/>
  <meta name="robots" content="index, follow"/>
  <style>
    /* =====================================================================
       FONTS
    ===================================================================== */
    @font-face {
      font-family: 'SF Pro';
      font-weight: 400;
      font-display: swap;
      src: local('SF Pro Text Regular'), local('SFProText-Regular'), local('SF Pro'), local('Arial');
    }
    @font-face {
      font-family: 'SF Pro';
      font-weight: 700;
      font-display: swap;
      src: local('SF Pro Text Bold'), local('SFProText-Bold'), local('SF Pro Bold'), local('Arial Bold');
    }
    @font-face {
      font-family: 'SF Pro Thin';
      font-weight: 100;
      font-display: swap;
      src: local('SF Pro Text Thin'), local('SFProText-Thin'), local('SF Pro Thin'), local('SF Pro'), local('Arial');
    }
    @font-face {
      font-family: 'Aalto';
      font-weight: 400;
      font-display: swap;
      src: local('Aalto'), local('Arial Narrow'), local('ArialNarrow');
    }

    /* =====================================================================
       ROOT / RESET
    ===================================================================== */
    :root {
      font-family: 'SF Pro', Arial, sans-serif;
      color: #fff;
      background: #090807;
      font-synthesis: none;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }
    html, body, button, a, .portal { cursor: none !important; }

    /* =====================================================================
       EXPERIENCE ROOT
    ===================================================================== */
    .experience {
      position: relative;
      width: 100%;
      height: 100%;
      min-height: 540px;
      overflow: hidden;
      background: #0a0908;
    }

    /* =====================================================================
       BACKGROUNDS
    ===================================================================== */
    .backgrounds,
    .background,
    .shade,
    .transition-layer,
    .transition-layer video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .background {
      object-fit: cover;
      opacity: 0;
      transition: opacity .8s ease;
    }
    .background.is-visible { opacity: 1; }
    .shade {
      z-index: 1;
      background: linear-gradient(to bottom, transparent 52%, rgba(0,0,0,.88) 100%);
      pointer-events: none;
    }

    /* =====================================================================
       CHROME
    ===================================================================== */
    .chrome {
      position: absolute;
      z-index: 4;
      transition: opacity .45s ease, filter .45s ease;
    }
    .experience.is-transitioning .chrome {
      opacity: 0;
      filter: blur(8px);
      pointer-events: none;
    }
    .experience.is-transitioning .header,
    .experience.is-transitioning .planet-list {
      opacity: 1;
      filter: none;
      pointer-events: auto;
    }
    .experience.is-transitioning .shade { opacity: 1; }
    .experience.is-committing .background { transition: none !important; }

    /* =====================================================================
       HEADER
    ===================================================================== */
    .header {
      left: clamp(18px, 1.95vw, 28px);
      right: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .header-actions {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .nav {
      display: flex;
      align-items: center;
      height: 42px;
      padding: 4px 5px;
      border: 1px solid rgba(255,255,255,.45);
      background: rgba(255,255,255,.1);
      backdrop-filter: blur(12px);
      border-radius: 999px;
    }
    .nav a {
      color: #fff;
      text-decoration: none;
      padding: 8px 19px;
      border-radius: 999px;
      line-height: 1;
      font-size: 14px;
    }
    .nav a.active { background: #fff; color: #000; }
    .menu {
      height: 42px;
      padding: 0 20px;
      border: 0;
      border-radius: 999px;
      background: #fff;
      color: #000;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
    }

    /* =====================================================================
       FLOATING LOGO
    ===================================================================== */
    .floating-logo {
      position: fixed;
      z-index: 22;
      left: 50%;
      top: 50%;
      width: 59px;
      height: 58px;
      transform: translate(-50%, -50%);
      will-change: left, top, width, height, transform;
      transition:
        left 2s cubic-bezier(.16,1,.3,1),
        top 2s cubic-bezier(.16,1,.3,1),
        width 2s cubic-bezier(.16,1,.3,1),
        height 2s cubic-bezier(.16,1,.3,1),
        transform 2s cubic-bezier(.16,1,.3,1);
    }
    .floating-logo.is-docked {
      left: clamp(18px, 1.95vw, 28px);
      top: clamp(18px, 3.1vh, 28px);
      width: 37px;
      height: 36px;
      transform: none;
    }
    .floating-logo.is-settled { z-index: 5; }

    /* =====================================================================
       PRELOADER COUNT
    ===================================================================== */
    .preloader-count {
      position: fixed;
      z-index: 22;
      left: 50%;
      bottom: clamp(22px, 3.1vh, 28px);
      display: flex;
      align-items: flex-end;
      gap: 4px;
      transform: translateX(-50%);
      font-family: 'SF Pro', Arial, sans-serif;
      line-height: 1;
    }
    .preloader-count > span:first-child {
      font-family: 'SF Pro Thin', 'SF Pro', Arial, sans-serif;
      font-size: 64px;
      font-weight: 100;
    }
    .preloader-count .percent {
      font-size: 24px;
      padding-bottom: 4px;
    }
    .preloader-count.is-leaving {
      animation: preload-count-out .75s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes preload-count-out {
      to { opacity: 0; filter: blur(7px); transform: translate(-50%, -34px); }
    }

    /* =====================================================================
       PRELOADER
    ===================================================================== */
    .preloader {
      position: absolute;
      inset: 0;
      z-index: 20;
      background: #000;
      overflow: hidden;
    }
    .preloader video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .preloader-shade {
      position: absolute;
      inset: auto 0 0;
      height: 35%;
      background: linear-gradient(to bottom, transparent, #000);
    }
    .preloader.is-background { z-index: 0; }
    .preloader.is-background .preloader-shade { opacity: 0; }

    /* =====================================================================
       CANVAS ELEMENTS
    ===================================================================== */
    .scene-canvas { display: none; }
    .portal-canvas {
      position: fixed;
      inset: 0;
      z-index: 3;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    /* =====================================================================
       PORTAL WRAP & PORTAL
    ===================================================================== */
    .portal-wrap {
      left: 50%;
      top: 50%;
      width: min(320px, 31vw);
      transform: translate(-50%, -54%);
      perspective: none;
    }
    .portal-heading {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      font-size: 16px;
      opacity: 0;
    }
    .portal-heading strong { font-size: 18px; margin-left: 8px; }
    .portal {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 320 / 350;
      padding: 0;
      overflow: visible;
      border: 0;
      border-radius: 90px;
      background: transparent;
      cursor: pointer;
      box-shadow: none;
      transform: none !important;
    }
    .portal video,
    .portal img {
      visibility: hidden;
      position: absolute;
      width: 1px;
      height: 1px;
      pointer-events: none;
    }

    /* =====================================================================
       PLANET CONTENT
    ===================================================================== */
    .planet-content {
      left: clamp(28px, 4vw, 58px);
      right: clamp(28px, 3vw, 44px);
      bottom: clamp(24px, 3vh, 30px);
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      gap: 40px;
    }
    .planet-content h1 {
      font-family: 'Aalto', 'Arial Narrow', sans-serif;
      font-size: clamp(128px, 21.8vw, 314px);
      font-weight: 400;
      line-height: .72;
      margin: 0 0 -.04em;
      letter-spacing: 0;
      transform: translateX(-32px);
      opacity: 0;
    }
    .planet-content dl {
      width: min(447px, 34vw);
      margin: 0;
      font-size: 16px;
    }
    .fact {
      display: grid;
      grid-template-columns: 138px 1fr;
      gap: 18px;
      padding: 8px 0;
      border-bottom: 1px solid rgba(255,255,255,.48);
      opacity: 0;
    }
    .fact:last-child { border-bottom: 0; }
    .fact dt { font-weight: 700; }
    .fact dd { margin: 0; }

    /* =====================================================================
       PLANET SIDEBAR LIST
    ===================================================================== */
    .planet-list {
      left: clamp(18px, 1.95vw, 28px);
      top: 50%;
      transform: translateY(-43%);
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 16px;
    }
    .planet-item {
      display: flex;
      align-items: center;
      min-height: 20px;
      color: rgba(255,255,255,.6);
    }
    .planet-item.active {
      font-size: 18px;
      font-weight: 700;
      gap: 8px;
      color: #fff;
    }
    .planet-item.active::before {
      content: '';
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      flex-shrink: 0;
    }

    /* =====================================================================
       TRANSITION LAYER / LOADING
    ===================================================================== */
    .transition-layer { display: none; }
    .loading {
      position: absolute;
      z-index: 12;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      opacity: 0;
      font-size: 12px;
      letter-spacing: .14em;
      text-transform: uppercase;
      transition: opacity .2s;
    }
    .experience.is-loading .loading { opacity: .8; }

    /* =====================================================================
       CUSTOM CURSOR
    ===================================================================== */
    .custom-cursor {
      display: block;
      position: fixed;
      left: 0;
      top: 0;
      z-index: 100;
      width: 1px;
      height: 1px;
      pointer-events: none;
      opacity: 0;
      transition: opacity .2s ease;
    }
    .custom-cursor.is-visible { opacity: 1; }
    .cursor-dot, .cursor-orbit {
      position: absolute;
      left: 0;
      top: 0;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }
    .cursor-dot {
      width: 12px;
      height: 12px;
      background: #fff;
    }
    .cursor-orbit {
      width: 36px;
      height: 36px;
      border: 1px solid #fff;
      background: rgba(255,255,255,.4);
      transition: transform .3s cubic-bezier(.22,1,.36,1);
    }
    .custom-cursor.is-enter .cursor-orbit {
      transform: translate(-50%, -50%) scale(1.16);
    }
    .cursor-label {
      position: absolute;
      top: 26px;
      left: 0;
      transform: translateX(-50%) translateY(-4px);
      font: 16px/1.2 'SF Pro', Arial, sans-serif;
      white-space: nowrap;
      opacity: 0;
      transition: opacity .2s ease, transform .3s cubic-bezier(.22,1,.36,1);
    }
    .custom-cursor.is-enter .cursor-label {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }
    body:not(.preload-complete) .custom-cursor { opacity: 0 !important; }

    /* =====================================================================
       ENTRANCE / SWITCH ANIMATIONS
    ===================================================================== */
    body:not(.intro-ready) .header,
    body:not(.intro-ready) .planet-list,
    body:not(.intro-ready) .planet-content h1,
    body:not(.intro-ready) .planet-content .fact { opacity: 0; }

    .intro-ready .header {
      animation: reveal-down .9s cubic-bezier(.22,1,.36,1) .1s both;
    }
    .intro-ready .planet-list {
      animation: reveal-side .9s cubic-bezier(.22,1,.36,1) .65s both;
    }
    .content-revealing h1 {
      animation: title-rise 1.05s cubic-bezier(.16,1,.3,1) both;
    }
    .content-revealing .fact {
      animation: fact-rise .72s cubic-bezier(.22,1,.36,1) both;
    }
    .content-revealing .fact:nth-child(1) { animation-delay: .52s; }
    .content-revealing .fact:nth-child(2) { animation-delay: .68s; }
    .content-revealing .fact:nth-child(3) { animation-delay: .84s; }
    .content-revealing .fact:nth-child(4) { animation-delay: 1s; }
    .mask-revealing .portal-heading {
      animation: portal-caption .85s cubic-bezier(.22,1,.36,1) both;
    }
    .planet-list.is-switching .planet-item {
      animation: menu-row .58s cubic-bezier(.22,1,.36,1) both;
    }
    .planet-list.is-switching .planet-item:nth-child(1) { animation-delay: .02s; }
    .planet-list.is-switching .planet-item:nth-child(2) { animation-delay: .05s; }
    .planet-list.is-switching .planet-item:nth-child(3) { animation-delay: .08s; }
    .planet-list.is-switching .planet-item:nth-child(4) { animation-delay: .11s; }
    .planet-list.is-switching .planet-item:nth-child(5) { animation-delay: .14s; }
    .planet-list.is-switching .planet-item:nth-child(6) { animation-delay: .17s; }
    .planet-list.is-switching .planet-item:nth-child(7) { animation-delay: .20s; }
    .planet-list.is-switching .planet-item:nth-child(8) { animation-delay: .23s; }
    .planet-list.is-switching .planet-item.active::before {
      animation: active-dot .55s cubic-bezier(.22,1,.36,1) .18s both;
    }

    @keyframes reveal-down {
      from { opacity: 0; filter: blur(8px); transform: translateY(-18px); }
      to   { opacity: 1; filter: blur(0);  transform: translateY(0); }
    }
    @keyframes reveal-side {
      from { opacity: 0; filter: blur(8px); transform: translate(-20px, -43%); }
      to   { opacity: 1; filter: blur(0);  transform: translate(0, -43%); }
    }
    @keyframes title-rise {
      from { opacity: 0; filter: blur(12px); transform: translate(-32px, 42px); }
      to   { opacity: 1; filter: blur(0);   transform: translate(-32px, 0); }
    }
    @keyframes fact-rise {
      from { opacity: 0; filter: blur(7px); transform: translateY(18px); }
      to   { opacity: 1; filter: blur(0);  transform: translateY(0); }
    }
    @keyframes portal-caption {
      from { opacity: 0; filter: blur(7px); transform: translateY(22px); }
      to   { opacity: 1; filter: blur(0);  transform: translateY(0); }
    }
    @keyframes menu-row {
      from { opacity: .35; transform: translateX(-8px); }
      to   { opacity: 1;   transform: translateX(0); }
    }
    @keyframes active-dot {
      from { opacity: 0; transform: scale(0); }
      to   { opacity: 1; transform: scale(1); }
    }

    /* =====================================================================
       RESPONSIVE
    ===================================================================== */
    @media (max-width: 900px) {
      .nav { display: none; }
      .portal-wrap { width: min(300px, 48vw); }
      .planet-content h1 { font-size: clamp(105px, 24vw, 190px); }
      .planet-content dl { width: 43vw; }
      .fact { grid-template-columns: 110px 1fr; }
      .planet-list { font-size: 14px; }
      .planet-item.active { font-size: 16px; }
    }
    @media (max-width: 640px) {
      .experience { min-height: 600px; }
      .planet-list { display: none; }
      .portal-wrap { top: 44%; width: min(260px, 66vw); }
      .planet-content { left: 18px; right: 18px; bottom: 18px; display: block; }
      .planet-content h1 { font-size: clamp(98px, 30vw, 160px); margin-bottom: 20px; }
      .planet-content dl { width: 100%; font-size: 13px; }
      .fact { grid-template-columns: 92px 1fr; padding: 5px 0; }
      .portal-heading { font-size: 14px; }
      .portal-heading strong { font-size: 16px; }
      .menu { height: 38px; }
      .portal { border-radius: 70px; }
    }
    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; }
      .portal { transform: none !important; }
    }
  </style>
</head>
<body>

<main class="experience" data-planet="mars">

  <!-- BACKGROUNDS -->
  <div class="backgrounds" aria-hidden="true">
    <video id="mars-background"  class="background is-visible"
           src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/3c83091e-4046-4fd6-adbb-2edb728be79a.mp4"
           muted playsinline preload="auto"></video>
    <video id="earth-background" class="background"

           muted playsinline preload="auto"></video>
    <video id="venus-background" class="background"
           src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/b30f64d9-1637-477a-83df-d0fc6461a422.mp4"
           muted playsinline preload="auto"></video>
  </div>

  <!-- PRELOADER -->
  <div class="preloader" id="preloader" aria-label="Loading Mars">
    <video id="preloader-video"
           src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/5fc5651c-3b5d-4171-b507-87f7e635d1b4.mp4"
           muted playsinline preload="auto"></video>
    <div class="preloader-shade"></div>
  </div>

  <!-- FLOATING LOGO -->
  <img class="floating-logo" id="floating-logo"
       src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/eb7e0f53-50cd-4af5-abc4-8b9a52cdc01b.svg"

  <!-- PRELOADER COUNT -->
  <div class="preloader-count" id="preloader-count" aria-live="polite">

  <!-- SCENE CANVAS (frozen frame) -->
  <canvas id="scene-canvas" class="scene-canvas" aria-hidden="true"></canvas>

  <!-- SHADE -->
  <div class="shade" aria-hidden="true"></div>

  <!-- HEADER -->
  <header class="header chrome">
    <div class="header-actions">
      <nav class="nav" aria-label="Primary navigation">
        <a class="active" href="#about">About</a>
        <a href="#explore">Explore</a>
        <a href="#planets">Planets</a>
      </nav>
      <button class="menu" type="button">Menu</button>
    </div>
  </header>

  <!-- PLANET SIDEBAR -->
  <aside class="planet-list chrome" aria-label="Planets"></aside>

  <!-- PORTAL CANVAS -->
  <canvas id="portal-canvas" class="portal-canvas" aria-hidden="true"></canvas>

  <!-- PORTAL WRAP -->
  <section class="portal-wrap chrome" aria-label="Next destination">
    <div class="portal-heading">
      <span>Next:</span>
      <span><span id="next-number">[03]</span> <strong id="next-name">Earth</strong></span>
    </div>
    <button class="portal" id="portal" type="button" aria-label="Travel to Earth">
      <video id="portal-video"
             src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4"
             muted playsinline preload="auto"></video>
      <img id="portal-image"
           src="https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg"
           alt="Mercury"/>
    </button>
  </section>

  <!-- PLANET CONTENT -->
  <section class="planet-content chrome" aria-live="polite">
    <h1 id="planet-title">MARS</h1>
    <dl id="facts"></dl>
  </section>

  <!-- TRANSITION LAYER -->
  <div class="transition-layer" aria-hidden="true">
    <video id="transition-video" muted playsinline preload="auto"></video>
  </div>

  <!-- LOADING -->
  <div class="loading" aria-hidden="true">Preparing orbit&hellip;</div>

  <!-- CUSTOM CURSOR -->
  <div class="custom-cursor" aria-hidden="true">
    <span class="cursor-orbit"></span>
    <span class="cursor-dot"></span>
    <span class="cursor-label">Enter</span>
  </div>

</main>

<script>
(function () {
  'use strict';

  var BASE       = 'https://d2ol7oe51mr4n9.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P';
  var TO_EARTH   = BASE + '/fc3ded42-e845-41f3-a830-5cab512d79cd.mp4';
  var TO_VENUS   = BASE + '/b30f64d9-1637-477a-83df-d0fc6461a422.mp4';
  var MERCURY    = BASE + '/d6fb8b6b-c15e-4aaa-9cf7-45bbb5e33372.jpg';

  var PLANETS = ['Mercury','Venus','Earth','Mars','Jupiter','Saturn','Uranus','Neptune'];

  var STATES = {
    mars: {
      name: 'Mars', next: 'Earth', number: '[03]',
      portal: TO_EARTH,
      background: 'mars-background',
      facts: [
        ['Distance:',    'About 228 million km (1.5 astronomical units).'],
        ['Year:',        'One Martian year is equal to 687 Earth days.'],
        ['Temperature:', 'Around -60 \u00b0C, dropping to -125 \u00b0C at the poles in winter.'],
        ['Atmosphere:',  'Very thin, consisting of 95% carbon dioxide, with frequent dust storms.']
      ]
    },
    earth: {
      name: 'Earth', next: 'Venus', number: '[02]',
      portal: TO_VENUS,
      background: 'earth-background',
      facts: [
        ['Distance:',    '149.6 million km from the Sun.'],
        ['Year:',        '365.25 Earth days.'],
        ['Temperature:', 'Average surface temperature around 15 \u00b0C.'],
        ['Atmosphere:',  'Mostly nitrogen and oxygen, supporting life and liquid water.']
      ]
    },
    venus: {
      name: 'Venus', next: 'Mercury', number: '[06]',
      image: MERCURY,
      background: 'venus-background',
      facts: [
        ['Distance:',    '108.2 million km from the Sun.'],
        ['Year:',        '225 Earth days.'],
        ['Temperature:', 'Around 465 \u00b0C \u2014 the hottest planet in the Solar System.'],
        ['Atmosphere:',  'Extremely dense, mostly carbon dioxide, with clouds of sulfuric acid.']
      ]
    }
  };

  /* --- DOM refs --- */
  var experience     = document.querySelector('.experience');
  var preloaderEl    = document.getElementById('preloader');
  var preloaderVideo = document.getElementById('preloader-video');
  var preloaderCount = document.getElementById('preloader-count');
  var preloaderValue = document.getElementById('preloader-value');
  var floatingLogo   = document.getElementById('floating-logo');
  var portalCanvas   = document.getElementById('portal-canvas');
  var sceneCanvas    = document.getElementById('scene-canvas');
  var planetTitle    = document.getElementById('planet-title');
  var factsEl        = document.getElementById('facts');
  var planetList     = document.querySelector('.planet-list');
  var nextNumber     = document.getElementById('next-number');
  var nextName       = document.getElementById('next-name');
  var portalBtn      = document.getElementById('portal');
  var portalVideo    = document.getElementById('portal-video');
  var portalImage    = document.getElementById('portal-image');
  var transitionLayer= document.querySelector('.transition-layer');
  var transitionVideo= document.getElementById('transition-video');
  var cursor         = document.querySelector('.custom-cursor');

  var pCtx = portalCanvas.getContext('2d');
  var sCtx = sceneCanvas.getContext('2d');

  /* --- State --- */
  var current          = 'mars';
  var busy             = false;
  var expansion        = 0;
  var maskScale        = 0;
  var canvasOpacity    = 1;
  var transitionActive = false;
  var frozenScene      = false;
  var renderCount      = 0;

  var rotX = 0, rotY = 0;
  var targetX = 0, targetY = 0;
  var cursorX = 0, cursorY = 0;
  var orbitX  = 0, orbitY  = 0;
  var lastTime = 0;

  /* --- Easing --- */
  function easeInOutCubic(t) {
    return t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
  }

  function animateValue(setter, duration) {
    return new Promise(function(resolve) {
      var start = performance.now();
      function step(now) {
        var p = Math.min((now - start) / duration, 1);
        setter(easeInOutCubic(p));
        if (p < 1) requestAnimationFrame(step);
        else resolve();
      }
      requestAnimationFrame(step);
    });
  }

  /* --- Canvas resize --- */
  function resizeCanvas() {
    var d = Math.min(devicePixelRatio || 1, 2);
    portalCanvas.width  = innerWidth  * d;
    portalCanvas.height = innerHeight * d;
    portalCanvas.style.width  = innerWidth  + 'px';
    portalCanvas.style.height = innerHeight + 'px';
    pCtx.setTransform(d, 0, 0, d, 0, 0);

    if (!frozenScene) {
      sceneCanvas.width  = innerWidth  * d;
      sceneCanvas.height = innerHeight * d;
      sceneCanvas.style.width  = innerWidth  + 'px';
      sceneCanvas.style.height = innerHeight + 'px';
      sCtx.setTransform(d, 0, 0, d, 0, 0);
    }
  }
  window.addEventListener('resize', resizeCanvas);

  /* --- drawCover --- */
  function drawCover(ctx, media, w, h) {
    var mw = media.videoWidth  || media.naturalWidth  || 1;
    var mh = media.videoHeight || media.naturalHeight || 1;
    var scale = Math.max(w / mw, h / mh);
    var dw = mw * scale, dh = mh * scale;
    var dx = (w - dw) / 2, dy = (h - dh) / 2;
    ctx.drawImage(media, dx, dy, dw, dh);
  }

  /* --- drawShade --- */
  function drawShade(ctx) {
    var grad = ctx.createLinearGradient(0, innerHeight * .52, 0, innerHeight);
    grad.addColorStop(0, 'rgba(0,0,0,0)');
    grad.addColorStop(1, 'rgba(0,0,0,.88)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, innerHeight * .52, innerWidth, innerHeight * .48);
  }

  /* --- Rounded rect points --- */
  function buildRoundedRectPoints(w, h, r) {
    r = Math.min(r, w / 2, h / 2);
    var pts = [];
    var PI = Math.PI;
    var corners = [
      [ w/2-r, -h/2+r, -PI/2,    0       ],
      [ w/2-r,  h/2-r,  0,        PI/2   ],
      [-w/2+r,  h/2-r,  PI/2,     PI     ],
      [-w/2+r, -h/2+r,  PI,       PI*1.5 ]
    ];
    for (var ci = 0; ci < corners.length; ci++) {
      var c = corners[ci];
      var cx2 = c[0], cy2 = c[1], a0 = c[2], a1 = c[3];
      for (var i = 0; i <= 10; i++) {
        var a = a0 + (a1 - a0) * i / 10;
        pts.push([cx2 + r * Math.cos(a), cy2 + r * Math.sin(a)]);
      }
    }
    return pts;
  }

  /* --- Project (fake perspective) --- */
  function project(x, y, cx, cy, rx, ry) {
    var ax = rx * Math.PI / 180;
    var ay = ry * Math.PI / 180;
    var xx = x * Math.cos(ay);
    var yy = y * Math.cos(ax);
    var z  = x * Math.sin(ay) - y * Math.sin(ax);
    var p  = 850 / (850 + z);
    return [cx + xx * p, cy + yy * p];
  }

  /* --- Main draw loop --- */
  function draw(now) {
    requestAnimationFrame(draw);
    var dt = Math.min((now - lastTime) || 16, 40);
    lastTime = now;

    rotX += (targetX - rotX) * Math.min(1, dt * .009);
    rotY += (targetY - rotY) * Math.min(1, dt * .009);

    pCtx.clearRect(0, 0, innerWidth, innerHeight);

    if (frozenScene) {
      pCtx.drawImage(sceneCanvas, 0, 0, innerWidth, innerHeight);
      drawShade(pCtx);
    }

    var rect = portalBtn.getBoundingClientRect();
    if (!rect.width) return;

    var e = expansion;
    var rectCx = rect.left + rect.width  / 2;
    var rectCy = rect.top  + rect.height / 2;
    var cx    = rectCx + (innerWidth  / 2 - rectCx) * e;
    var cy    = rectCy + (innerHeight / 2 - rectCy) * e;
    var baseW = rect.width  + (innerWidth  - rect.width)  * e;
    var baseH = rect.height + (innerHeight - rect.height) * e;
    var scale = e ? 1 : maskScale;
    var w     = baseW * scale;
    var h     = baseH * scale;
    var r     = 90 * (1 - e) * scale;
    var rx    = rotX * (1 - e);
    var ry    = rotY * (1 - e);

    if (w > 1 && h > 1) {
      var pts = buildRoundedRectPoints(w, h, r);
      var projected = pts.map(function(pt) {
        return project(pt[0], pt[1], cx, cy, rx, ry);
      });

      pCtx.save();
      pCtx.globalAlpha = canvasOpacity;

      pCtx.beginPath();
      pCtx.moveTo(projected[0][0], projected[0][1]);
      for (var i = 1; i < projected.length; i++) {
        pCtx.lineTo(projected[i][0], projected[i][1]);
      }
      pCtx.closePath();
      pCtx.clip();

      pCtx.fillStyle = '#030303';
      pCtx.fillRect(0, 0, innerWidth, innerHeight);

      var media;
      if (transitionActive) {
        media = transitionVideo;
      } else if (STATES[current].image) {
        media = portalImage;
      } else {
        media = portalVideo;
      }
      drawCover(pCtx, media, innerWidth, innerHeight);

      if (transitionActive) {
        drawShade(pCtx);
      }

      pCtx.restore();
    }
  }

  /* --- Cursor loop --- */
  function cursorLoop() {
    requestAnimationFrame(cursorLoop);
    orbitX += (cursorX - orbitX) * 0.2;
    orbitY += (cursorY - orbitY) * 0.2;
    cursor.style.transform = 'translate3d(' + orbitX + 'px,' + orbitY + 'px,0)';
  }

  /* --- Pointer events --- */
  document.addEventListener('pointermove', function(e) {
    cursorX = e.clientX;
    cursorY = e.clientY;
    cursor.classList.add('is-visible');
    if (!busy) {
      targetY =  (e.clientX / innerWidth  - .5) * 37.4;
      targetX =  (e.clientY / innerHeight - .5) * -33;
    }
  });
  document.addEventListener('mouseleave', function() {
    cursor.classList.remove('is-visible');
  });
  document.addEventListener('pointerleave', function() {
    targetX = 0; targetY = 0;
  });
  portalBtn.addEventListener('pointerenter', function() { cursor.classList.add('is-enter'); });
  portalBtn.addEventListener('pointerleave', function() { cursor.classList.remove('is-enter'); });
  portalBtn.addEventListener('click', function() { travel(); });

  /* --- waitFor --- */
  function waitFor(el, events, timeout) {
    return new Promise(function(resolve) {
      var done = false;
      function finish() { if (!done) { done = true; resolve(); } }
      events.forEach(function(ev) { el.addEventListener(ev, finish, { once: true }); });
      if (timeout) setTimeout(finish, timeout);
    });
  }

  /* --- Render --- */
  function render() {
    var state = STATES[current];
    experience.setAttribute('data-planet', current);
    planetTitle.textContent = state.name.toUpperCase();
    nextNumber.textContent  = state.number;
    nextName.textContent    = state.next;
    portalBtn.setAttribute('aria-label', 'Travel to ' + state.next);

    // Facts
    factsEl.innerHTML = '';
    state.facts.forEach(function(f) {
      var div = document.createElement('div');
      div.className = 'fact';
      var dt = document.createElement('dt');
      dt.textContent = f[0];
      var dd = document.createElement('dd');
      dd.textContent = f[1];
      div.appendChild(dt);
      div.appendChild(dd);
      factsEl.appendChild(div);
    });

    // Planet list
    if (renderCount > 0) {
      planetList.classList.remove('is-switching');
      void planetList.offsetWidth;
      planetList.classList.add('is-switching');
    }
    planetList.innerHTML = '';
    PLANETS.forEach(function(p) {
      var span = document.createElement('span');
      span.className = 'planet-item' + (p.toLowerCase() === current ? ' active' : '');
      span.textContent = p;
      planetList.appendChild(span);
    });

    // Background
    document.querySelectorAll('.background').forEach(function(bg) {
      bg.classList.toggle('is-visible', bg.id === state.background);
    });

    // Portal media
    if (state.image) {
      portalImage.src = state.image;
    } else {
      if (portalVideo.getAttribute('src') !== state.portal) {
        portalVideo.src = state.portal;
        portalVideo.load();
      }
    }

    renderCount++;
  }

  /* --- revealMask --- */
  function revealMask() {
    experience.classList.remove('mask-revealing');
    void experience.offsetWidth;
    experience.classList.add('mask-revealing');
    maskScale = 0;
    return animateValue(function(v) { maskScale = v; }, 1050);
  }

  /* --- revealPlanetContent --- */
  function revealPlanetContent() {
    experience.classList.remove('content-revealing');
    void experience.offsetWidth;
    experience.classList.add('content-revealing');
  }

  /* --- startExperience --- */
  function startExperience() {
    var p;
    if (!STATES[current].image) {
      p = waitFor(portalVideo, ['canplaythrough', 'error'], 2000)
        .then(function() {
          portalVideo.currentTime = 0;
          return portalVideo.play().catch(function() {});
        });
    } else {
      p = Promise.resolve();
    }

    return p.then(function() {
      return revealMask();
    }).then(function() {
      document.body.classList.add('intro-ready');
      // Background loop
      var bgEl = document.getElementById(STATES[current].background);
      if (bgEl) { bgEl.loop = true; bgEl.play().catch(function() {}); }
      setTimeout(revealPlanetContent, 850);
    });
  }

  /* --- TRAVEL --- */
  function travel() {
    if (busy || current === 'venus') return;
    busy = true;
    targetX = 0; targetY = 0;

    var nextState = current === 'mars' ? 'earth' : 'venus';

    transitionVideo.src = STATES[current].portal;
    transitionVideo.load();
    transitionLayer.style.display = 'block';
    experience.classList.add('is-loading');

    waitFor(transitionVideo, ['canplaythrough', 'error'], 1600)
      .then(function() {
        experience.classList.remove('is-loading');
        experience.classList.remove('content-revealing');
        experience.classList.remove('mask-revealing');
        experience.classList.add('is-transitioning');

        transitionVideo.currentTime = 0;
        transitionVideo.playbackRate = 1.3;
        canvasOpacity = 1;
        transitionActive = true;
        return transitionVideo.play().catch(function() {});
      })
      .then(function() {
        return animateValue(function(v) { expansion = v; }, 1100);
      })
      .then(function() {
        return waitFor(transitionVideo, ['ended', 'error'], 8000);
      })
      .then(function() {
        // Freeze frame
        frozenScene = true;
        sceneCanvas.style.display = 'block';
        sCtx.clearRect(0, 0, innerWidth, innerHeight);
        drawCover(sCtx, transitionVideo, innerWidth, innerHeight);

        current = nextState;
        experience.classList.add('is-committing');
        render();

        return new Promise(function(res) {
          requestAnimationFrame(function() { requestAnimationFrame(res); });
        });
      })
      .then(function() {
        transitionActive = false;
        expansion = 0;
        maskScale = 0;
        canvasOpacity = 1;

        experience.classList.remove('is-transitioning');
        experience.classList.remove('is-committing');

        // Start background for new state
        var bgEl = document.getElementById(STATES[current].background);
        if (bgEl) { bgEl.loop = true; bgEl.play().catch(function() {}); }

        var maskRevealPromise = revealMask();
        setTimeout(revealPlanetContent, 100);

        if (!STATES[current].image) {
          portalVideo.currentTime = 0;
          portalVideo.play().catch(function() {});
        }

        return maskRevealPromise;
      })
      .then(function() {
        setTimeout(function() {
          frozenScene = false;
          sceneCanvas.style.display = 'none';
          transitionVideo.src = '';
          transitionVideo.load();
          transitionLayer.style.display = 'none';
          busy = false;
        }, 450);
      })
      .catch(function(err) {
        console.warn('Travel error:', err);
        transitionActive = false;
        expansion = 0;
        maskScale = 1;
        canvasOpacity = 1;
        frozenScene = false;
        sceneCanvas.style.display = 'none';
        experience.classList.remove('is-transitioning', 'is-committing', 'is-loading');
        busy = false;
      });
  }

  /* --- PRELOADER --- */
  var preloaderFinished = false;

  function finishPreloader() {
    if (preloaderFinished) return;
    preloaderFinished = true;

    preloaderValue.textContent = '100';
    preloaderCount.classList.add('is-leaving');
    floatingLogo.classList.add('is-docked');
    preloaderEl.classList.add('is-background');
    document.body.classList.add('preload-complete');

    startExperience();

    setTimeout(function() { preloaderCount.style.display = 'none'; }, 750);
    setTimeout(function() { floatingLogo.classList.add('is-settled'); }, 2000);
  }

  function runPreloader() {
    preloaderVideo.addEventListener('loadedmetadata', function() {
      var dur = preloaderVideo.duration || 3;
      preloaderVideo.playbackRate = Math.max(.25, dur / 3);

      var rafId;
      function updateCount() {
        var val = Math.round((preloaderVideo.currentTime / (preloaderVideo.duration || 1)) * 100);
        preloaderValue.textContent = String(Math.min(val, 99));
        if (!preloaderVideo.ended && !preloaderFinished) {
          rafId = requestAnimationFrame(updateCount);
        }
      }
      rafId = requestAnimationFrame(updateCount);

      preloaderVideo.addEventListener('ended', function() {
        cancelAnimationFrame(rafId);
        finishPreloader();
      }, { once: true });

      preloaderVideo.play().catch(function() {
        finishPreloader();
      });
    }, { once: true });

    preloaderVideo.addEventListener('error', finishPreloader, { once: true });
    setTimeout(function() { if (!preloaderFinished) finishPreloader(); }, 5000);
  }

  /* --- BOOT --- */
  document.querySelectorAll('.background').forEach(function(bg) {
    bg.pause();
    try { bg.currentTime = 0; } catch(e) {}
  });

  resizeCanvas();
  render();
  requestAnimationFrame(draw);
  requestAnimationFrame(cursorLoop);
  runPreloader();

}());
</script>
</body>
</html>
